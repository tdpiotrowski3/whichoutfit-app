# Drains the Instagram posting queue every 15 minutes.
#
# Why this lives here and not in vercel.json: Vercel's Hobby plan fails any
# deployment with a cron more frequent than daily, and the publisher needs two
# runs per Reel (create the container, then publish once Meta has transcoded
# it). A daily cron would post every Reel a day late. See lib/socialPublish.ts.
#
# Needs one repo secret: CRON_SECRET, the same value as the Vercel env var.
# GitHub only runs schedules from the default branch, and may start them a few
# minutes late under load. Fine for a 6:30pm slot.

name: social-publish

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: social-publish
  cancel-in-progress: false

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call the publish endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET repo secret is not set"
            exit 1
          fi
          curl --silent --show-error --fail-with-body --max-time 90 \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://admin.whichoutfit.app/api/cron/social-publish
          echo
